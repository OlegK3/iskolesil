name: iskolesil
description: ИСКОЛЕСИЛ — GPS-трекер для велосипедистов с накопительной картой поездок (карта — Яндекс MapKit).
publish_to: none
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  yandex_mapkit: ^4.3.0
  xml: ^6.5.0
  file_picker: ^8.1.6
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
