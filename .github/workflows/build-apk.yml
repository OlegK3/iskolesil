name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - name: Android scaffold + patch
        run: bash tool/bootstrap.sh
      - name: Local map glyphs (non-fatal)
        continue-on-error: true
        run: bash tool/make_glyphs.sh
      - run: flutter pub get
      - name: Dependency audit (no foreign cloud/telemetry SDKs)
        run: bash tool/audit_network.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Gradle init script (compileSdk 36 for all plugins)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'GRADLE'
          allprojects { proj ->
            proj.plugins.withId('com.android.library') {
              proj.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                def cur = dsl.compileSdk
                if (cur == null || cur < 36) { dsl.compileSdk = 36 }
              }
            }
          }
          GRADLE
      - name: Release signing key (if secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iskolesil.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/iskolesil.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No signing secrets: APK is signed with a temporary debug key and will not update over a differently signed install."
          fi
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: iskolesil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
